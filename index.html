<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- BARRA DE CARREGAMENTO -->
  <div id="barra-progresso" class="barra-progresso"></div>

  <!-- PÁGINA 1: TELA INICIAL DO GOOGLE -->
  <main id="tela-inicial" class="tela-inicial">
    <header class="topo-inicial">
      <div class="abas-topo-mobile">
        <span class="aba-ativa">Tudo</span>
        <span>Imagens</span>
      </div>
      <div class="avatar-usuario">V</div>
    </header>

    <div class="centro-inicial">
      <div class="logo-google-grande" aria-label="Google">
        <span class="g-azul">G</span><span class="g-vermelho">o</span><span class="g-amarelo">o</span><span class="g-azul">g</span><span class="g-verde">l</span><span class="g-vermelho">e</span>
      </div>

      <form id="form-busca-inicial" class="caixa-pesquisa">
        <svg class="icone-lupa" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="input-busca-inicial" placeholder="Pesquise no Google ou digite um URL" autocomplete="off">
        <svg class="icone-mic" viewBox="0 0 24 24">
          <path fill="#4285f4" d="M12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z"/>
          <path fill="#34a853" d="M11 18.08h2v3.92h-2z"/>
          <path fill="#fbbc05" d="M7.05 16.87c-1.27-1.33-2.05-2.83-2.05-4.87h2c0 1.45 0.56 2.42 1.47 3.38v0.32l-1.15 1.18z"/>
          <path fill="#ea4335" d="M12 16.93a4.97 5.25 0 0 1 -3.54 -1.55l-1.41 1.49c1.26 1.34 3.02 2.13 4.95 2.13 3.87 0 6.99-2.92 6.99-7h-1.99c0 2.92-2.24 4.93-5 4.93z"/>
        </svg>
      </form>

      <div class="botoes-iniciais">
        <button type="button" id="btn-pesquisar" class="btn-google">Pesquisa Google</button>
        <button type="button" id="btn-sorte" class="btn-google">Estou com sorte</button>
      </div>

      <div class="sugestoes-rapidas" id="lista-sugestoes"></div>
    </div>
  </main>

  <!-- PÁGINA 2: RESULTADOS DA PESQUISA -->
  <div id="tela-resultados" class="tela-resultados oculto">
    <header class="cabecalho-serp">
      <div class="linha-topo-serp">
        <div class="logo-google-pequena" id="voltar-inicio">
          <span class="g-azul">G</span><span class="g-vermelho">o</span><span class="g-amarelo">o</span><span class="g-azul">g</span><span class="g-verde">l</span><span class="g-vermelho">e</span>
        </div>

        <form id="form-busca-serp" class="caixa-pesquisa serp-barra">
          <input type="text" id="input-busca-serp" autocomplete="off">
          <button type="submit" class="btn-lupa-serp" aria-label="Pesquisar">
            <svg class="icone-lupa-azul" viewBox="0 0 24 24">
              <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
          </button>
        </form>

        <div class="avatar-usuario">V</div>
      </div>

      <nav class="abas-serp">
        <span class="aba-serp ativa">Tudo</span>
        <span class="aba-serp">Maps</span>
        <span class="aba-serp">Imagens</span>
        <span class="aba-serp">Vídeos</span>
        <span class="aba-serp">Notícias</span>
      </nav>
    </header>

    <main class="conteudo-serp">
      <div class="localizacao-barra">
        <span class="bolinha-local"></span>
        <span id="texto-localizacao"></span>
      </div>

      <!-- BLOCO DO GOOGLE MEU NEGÓCIO / MAPS -->
      <section class="bloco-maps">
        <div class="titulo-secao-maps">
          <h2>Locais</h2>
        </div>

        <div class="mapa-simulado">
          <div class="pino-mapa pino-1"></div>
          <div class="pino-mapa pino-2"></div>
          <div class="pino-mapa pino-3"></div>
          <span class="selo-mapa">Jardim Anália Franco e região</span>
        </div>

        <div id="lista-locais-maps" class="lista-locais"></div>
      </section>

      <!-- RESULTADOS ORGÂNICOS -->
      <section id="lista-resultados-organicos" class="lista-organicos"></section>
    </main>
  </div>

</body>
</html>
